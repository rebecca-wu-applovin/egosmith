# Ego-Exo4D variant of heuristic_clip_config.yaml: decode 448x448 (square) instead
# of 448x256. The Aria ego RGB stream is 1408x1408 square fisheye; squashing it to
# 448x256 halves hand-box areas + degrades detection (Gate A pass 14/222 vs 79/222
# on cmu_bike01_2, measured 2026-08-25). Gates/thresholds otherwise IDENTICAL.
paths:
  model_path: ''
runtime:
  postfix_update_every: 10
  gc_every: 32
heuristic:
  skip_frames: 15
  decode_width: 448
  decode_height: 448
  fallback_full_video: false
  output_size: null
  gate_a:
    roi:
    - 0.075
    - 0.075
    - 0.925
    - 1.0
    min_area_ratio: 0.02
    max_area_ratio: 0.5
    conf_thresh: 0.3
    box_conf_thresh: 0.3
    min_hands: 2
  gate_b:
    flow_max_corners: 128
    flow_quality_level: 0.01
    flow_min_distance: 7
    flow_block_size: 7
    flow_min_tracked: 24
    camera_motion_thresh: 0.2
    ransac_reproj_thresh: 3.0
    min_inlier_ratio: 0.3
  gate_c:
    min_keep_sec: 2.0
    max_consecutive_invalid: 3

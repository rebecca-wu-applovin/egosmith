# EgoVerse-microagi variant: mecka geometry (16:9 640x360 head-cam, hands small
# in frame -> min_area_ratio 0.005), but min_hands=1 — the native path certifies
# per-hand visibility via GT presence-projection; Stage-1 here only gates hand SIZE
# + camera stability, and single-hand moments are legitimate content.
paths:
  model_path: ''
runtime:
  postfix_update_every: 10
  gc_every: 32
heuristic:
  skip_frames: 15
  decode_width: 448
  decode_height: 256
  fallback_full_video: false
  output_size: null
  gate_a:
    roi:
    - 0.075
    - 0.075
    - 0.925
    - 1.0
    min_area_ratio: 0.005
    max_area_ratio: 0.5
    conf_thresh: 0.3
    box_conf_thresh: 0.3
    min_hands: 1
  gate_b:
    flow_max_corners: 128
    flow_quality_level: 0.01
    flow_min_distance: 7
    flow_block_size: 7
    flow_min_tracked: 24
    camera_motion_thresh: 0.2
    ransac_reproj_thresh: 3.0
    min_inlier_ratio: 0.3
  gate_c:
    min_keep_sec: 2.0
    max_consecutive_invalid: 3

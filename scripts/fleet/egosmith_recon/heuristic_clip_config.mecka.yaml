# EgoVerse-mecka variant of heuristic_clip_config.yaml. Egocentric human head-cam
# mp4s (flagship 320x180, freeform 960x540 — both 16:9, so the production 448x256
# decode aspect is already correct). ONE change vs production, measured 2026-08-27
# on real samples (flagship 69199812..., freeform 6919982585...):
#   * min_area_ratio 0.005 (from 0.02) — hands at this FOV occupy ~0.5-2% of frame;
#     production Gate A passes 2/203 (flagship) and 5/226 (freeform) sampled frames
#     despite clear two-hand manipulation; at 0.005 with min_hands=2 retained it
#     passes 188/203 and 223/226. Gate B camera-stability healthy (181/199 stable).
# Gates/thresholds otherwise IDENTICAL to production.
paths:
  model_path: ''
runtime:
  postfix_update_every: 10
  gc_every: 32
heuristic:
  skip_frames: 15
  decode_width: 448
  decode_height: 256
  fallback_full_video: false
  output_size: null
  gate_a:
    roi:
    - 0.075
    - 0.075
    - 0.925
    - 1.0
    min_area_ratio: 0.005
    max_area_ratio: 0.5
    conf_thresh: 0.3
    box_conf_thresh: 0.3
    min_hands: 2
  gate_b:
    flow_max_corners: 128
    flow_quality_level: 0.01
    flow_min_distance: 7
    flow_block_size: 7
    flow_min_tracked: 24
    camera_motion_thresh: 0.2
    ransac_reproj_thresh: 3.0
    min_inlier_ratio: 0.3
  gate_c:
    min_keep_sec: 2.0
    max_consecutive_invalid: 3

# Egocentric-100K Phase B convert — K8s Indexed Job (rendered by python os.path.expandvars).
# One pod per Stage-1 shard (1:1, 3000): pull shard kept.jsonl, stream its part.tars, decode +
# fisheye-undistort at 15fps, write one frame tar per valid interval, upload tars + manifest.
# CPU-bound; 1 GPU requested only for proven l4-pool packing/autoscaling (8 pods/node).
apiVersion: batch/v1
kind: Job
metadata:
  name: ego-convert-${JOB_SUFFIX}
  namespace: ${NAMESPACE}
spec:
  completionMode: Indexed
  completions: ${COMPLETIONS}
  parallelism: ${PARALLELISM}
  backoffLimit: 1000   # 3000 shards; tolerate transient failures without nuking the job
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ${K8S_SA}
      nodeSelector:
        node_pool: l4
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["us-central1-b", "us-central1-c"]
      tolerations:
      - {key: "l4-pool", operator: "Equal", value: "true", effect: "NoSchedule"}
      - {key: "nvidia.com/gpu", operator: "Equal", value: "present", effect: "NoSchedule"}
      containers:
      - name: ego-convert
        image: ${IMAGE}
        command: ["bash","-lc","gcloud storage cp gs://foundational-research/hoi-dataset/egosmith_recon/fleet/pod_entry_egocentric_convert.sh /tmp/pe.sh && exec bash /tmp/pe.sh"]
        workingDir: /repo
        env:
        - {name: NSHARDS,     value: "${COMPLETIONS}"}
        - name: SHARD
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - {name: NPROC,       value: "${NPROC}"}
        - {name: MAX_CLIPS,   value: "${MAX_CLIPS}"}
        - {name: TARGET_FPS,  value: "15"}
        - {name: LOCAL_ROOT,  value: "/scratch/ego_convert"}
        - {name: FRAMES_GCS,    value: "${FRAMES_GCS}"}
        - {name: MANIFESTS_GCS, value: "${MANIFESTS_GCS}"}
        resources:
          # decode+remap+jpeg is CPU work; ~13GB of tars per shard on scratch.
          requests: {nvidia.com/gpu: "1", cpu: "10", memory: "20Gi", ephemeral-storage: "30Gi"}
          limits:   {nvidia.com/gpu: "1", cpu: "12", memory: "40Gi", ephemeral-storage: "45Gi"}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: scratch
        emptyDir: {sizeLimit: 40Gi}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 8Gi}

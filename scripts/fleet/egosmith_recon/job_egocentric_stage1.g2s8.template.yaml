# g2-standard-8 (1x L4 / 8 vCPU / ~32Gi) VARIANT of job_egocentric_stage1.template.yaml.
# Targets the new MKS single-GPU L4 nodes (one pod per node). Originals untouched —
# the Egocentric-100K run may still reference them.
# Changes vs original: nodeSelector by instance-type (no node_pool: l4, no zone pin),
# model-serve + gpu-Exists tolerations, resources trimmed to fit 1x L4 / 8 vCPU / 32Gi.
apiVersion: batch/v1
kind: Job
metadata:
  name: ego-stage1-${JOB_SUFFIX}
  namespace: ${NAMESPACE}
spec:
  completionMode: Indexed
  completions: ${COMPLETIONS}
  parallelism: ${PARALLELISM}
  backoffLimit: 400   # many shards; tolerate transient failures without nuking the job
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ${K8S_SA}
      nodeSelector:
        node.kubernetes.io/instance-type: g2-standard-8
      tolerations:
      - {key: "applvn.dev/workload", operator: "Equal", value: "model-serve", effect: "NoSchedule"}
      - {key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule"}
      containers:
      - name: ego-stage1
        image: ${IMAGE}
        command: ["bash","-lc","gcloud storage cp gs://foundational-research/hoi-dataset/egosmith_recon/fleet/pod_entry_egocentric_stage1.sh /tmp/pe.sh && exec bash /tmp/pe.sh"]
        workingDir: /repo
        env:
        - {name: NSHARDS,     value: "${NSHARDS}"}
        - name: SHARD
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - {name: BALANCE,     value: "${BALANCE}"}
        - {name: SMOKE_LIMIT, value: "${SMOKE_LIMIT}"}
        - {name: PARTS_INDEX_GCS, value: "${PARTS_INDEX_GCS}"}
        - {name: OUTGCS,      value: "${OUTGCS}"}
        - {name: LOCAL_ROOT,  value: "/scratch/ego_s1"}
        resources:
          # One pod owns the whole g2-standard-8 node: 1x L4, <=7 vCPU, mem limit <=28Gi.
          # Nodes shared with model-serve — conservative requests, preemption-tolerant
          # (idempotent shards + skip-if-done resume).
          requests: {nvidia.com/gpu: "1", cpu: "6", memory: "20Gi", ephemeral-storage: "16Gi"}
          limits:   {nvidia.com/gpu: "1", cpu: "7", memory: "28Gi", ephemeral-storage: "24Gi"}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: scratch
        emptyDir: {sizeLimit: 24Gi}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 6Gi}

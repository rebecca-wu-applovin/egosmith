# Dexora robot spec -- AIRBOT Play bimanual platform ("robot_type: airbot_play").
# DoF VERIFICATION (keep-list said "12-DoF hands, verify model"): observation.state is 39-d =
#   6 left_arm + 6 right_arm + 12 left_hand + 12 right_hand + 2 head + 1 spine.
#   Hands are 12-DoF CONFIRMED (left/right_hand_joint_1..12) on BOTH layouts
#   (dexora/<task> per-task repos and airbot_* aggregate repos; identical schema, v2.1).
# fps: 20 (meta/info.json; timestamp column steps at exactly 0.05 s).
# Limit derivation method (no manufacturer spec sheet available for this exact stack):
#   - pos_min/pos_max = [p0.1 - 0.15 rad, p99.9 + 0.15 rad] of the sampled measured-joint
#     distribution (sample sizes listed below). Positions outside this envelope indicate
#     encoder glitches / retarget blowups rather than legitimate motion.
#   - max_vel = per-joint p99.9(|dq/dt|) x 1.5, dt taken from the DATA (per-frame timestamps
#     when present, else metadata fps). NEVER an assumed frame rate -- limits are
#     velocity x frame-interval and a wrong fps silently rescales every limit.
#   - max_acc = per-joint p99.9(|d2q/dt2|) x 1.5, same dt sourcing.
#   - caps: where the p99.9x1.5 suggestion itself is polluted by glitches (>0.1% of frames
#     jumping), a physical cap is applied instead and noted inline.
# Calibration sample: FULL dataset (23,715 episode parquets, both layouts; 450
#  zero-byte upstream files excluded).
# NOTE (velocity-drop audit, 2026-08): limits are the CLEAN-TAIL p99.9 x 1.5 --
# per-joint velocities computed over a 3,030-episode stratified sample (15 eps/task,
# canonical task-level view), frames with v > 10 x p99 excluded as corrupt before taking
# p99.9. Key finding: left/right_hand_joint_3 legitimately reaches ~29 rad/s at p99
# (fast gripper-like DoF; zero frames above 10 x p99 -> genuinely fast, not glitchy).
# An earlier 25 rad/s cap on that joint velocity-dropped ~4.6K episodes whose motion was
# smooth and only 1.1-1.6x over the capped limit (audited on 20 episodes across tasks:
# uniform dt=0.05, no boundary clustering, no teleport signatures). Floors: vel >= 1
# rad/s, acc >= 50 rad/s^2 (static head/spine joints degenerate to ~0 suggestions).
# Teleports/corrupt rows are still caught by hard_peak_ratio=3.
# ACCEL (second audit pass): accel limits anchor at max(clean p99.9 x 1.5,
# clean p99.99 x 1.15) over the full 3,030-episode stratified sample -- the hand_joint_3
# channels chatter with a heavy stationary accel tail (p99.99/p99.9 up to 1.8), so the
# thin x1.5 margin on p99.9 alone dropped ~3.1K episodes whose exceedances were 1.1-1.5x
# scattered chatter, not corruption (12-episode audit: no teleports, no dt anomalies).

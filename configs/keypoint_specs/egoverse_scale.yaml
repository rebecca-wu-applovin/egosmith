# EgoVerse scale — 22,570 zarr-v3 episodes; in-zarr images.front_1 are 640x480 and match
# the intrinsics; the sibling mp4 is a 320x240 downscale -> frames from zarr images.
# Kpt audit PASS 46/46 conv-A (4-7 incomplete episodes), 3/3 overlays lock
# (_audits/egoverse_scale_kpt_audit_2026-08-27/). scale_old / scale_test / test_* HELD.
dataset: egoverse_scale
source_id: egoverse_scale
split: train
fps: 30
lowdim_schema: egoverse_keypoints_world_v1
extractor: egoverse_zarr3
presence_requires_projection: true
glitch_jump_thresh_m: 0.05
glitch_rot_spike_frob: 0.99
extractor_args:
  gcs_prefix: gs://foundational-research/hoi-dataset/EgoVerse/processed_v3
  sources: [scale]
  quat_order: wxyz
  camera: front_1
  keypoint_tip_indices: [4, 8, 12, 16, 20]
  pose_frame: world
  frames_source: zarr_images
  min_kpt_coverage: 0.5
  read_annotations: true
